<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713"><meta name="description" content="Contact LIFT about your plan, support options, or the platform.">
  <title>Contact LIFT | LIFT</title>
  <link rel="stylesheet" href="../../Shared/Components/Public/Navbar/navbar.css">
  <link rel="stylesheet" href="../../Shared/Components/Public/Footer/footer.css">
  <link rel="stylesheet" href="../../Shared/CSS/theme.css">
  <link rel="stylesheet" href="../LandingPage/landing-sections.css">
  <link rel="stylesheet" href="../editorial-pages.css">
  <script src="../../Shared/JS/theme.js"></script>
  <script src="../../Shared/Components/Public/Navbar/navbar.js" defer></script>
  <script src="../../Shared/Components/Public/Footer/footer.js" defer></script>
  <script src="contact-us.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a><lift-navbar></lift-navbar>
  <main id="main">
    <section class="post-section contact-section" id="contact" aria-labelledby="contact-title"><div class="post-wrap contact-stage"><span class="section-pill contact-pill">CONTACT US</span><div class="contact-heading"><h1 id="contact-title">We’re here <em>to help you.</em></h1><p>Have a question about LIFT, your plan, or your support options? Send us a message and we’ll get back to you.</p></div>
      <div class="contact-image contact-image--one" aria-hidden="true"><img src="../LandingPage/assets/contact-move.jpg" alt="" loading="lazy" decoding="async"></div><div class="contact-image contact-image--two" aria-hidden="true"><img src="../LandingPage/assets/contact-fuel.jpg" alt="" loading="lazy" decoding="async"></div><div class="contact-image contact-image--three" aria-hidden="true"><img src="../LandingPage/assets/contact-recover.jpg" alt="" loading="lazy" decoding="async"></div><div class="contact-image contact-image--four" aria-hidden="true"><img src="../LandingPage/assets/contact-coach.jpg" alt="" loading="lazy" decoding="async"></div>
      <form class="landing-contact-form" id="landing-contact-form" data-endpoint=""><div class="contact-form-top"><span>YOUR MESSAGE</span><span>01 — 05</span></div><div class="contact-fields"><label for="contact-name">Full Name<input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Your full name" maxlength="100" required></label><label for="contact-email">Email<input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="120" required></label><label for="contact-address">Address<input id="contact-address" name="address" type="text" autocomplete="street-address" placeholder="Your address" maxlength="180"></label><label for="contact-phone">Phone<input id="contact-phone" name="phone" type="tel" autocomplete="tel" placeholder="Your phone number" maxlength="40"></label><label class="message-field" for="contact-message">Message<textarea id="contact-message" name="message" rows="5" placeholder="How can we help?" maxlength="2000" required></textarea></label></div><div class="contact-form-end"><p>Contact delivery will be available when the service is connected.</p><button type="submit">SEND MESSAGE <span aria-hidden="true">→</span></button></div><p class="contact-status" id="contact-status" role="status" aria-live="polite" hidden></p></form>
    </div></section>

  </main><lift-footer></lift-footer>
</body>
</html>
